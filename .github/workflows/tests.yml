name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Oracle test suite (MXFP4 repacker bit-exactness)
        run: python -m pytest tests/test_repack_mxfp4.py
