[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "theseus-llm"
version = "0.1.0"
description = "Inspect, verify, and plan deployment of open models too large for your machine"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["requests>=2.28", "numpy>=1.24"]

[project.optional-dependencies]
convert = ["torch>=2.4", "transformers>=4.55", "safetensors>=0.4", "tiktoken", "blobfile"]

[project.scripts]
theseus = "theseus.cli:main"

[tool.setuptools]
packages = [
    "theseus",
    "theseus._vendor",
    "theseus._vendor.gguf",
    "theseus._vendor.conversion",
]

[tool.setuptools.package-data]
"theseus._vendor" = ["PATCHES.md", "LICENSE.llama.cpp"]
"theseus._vendor.gguf" = ["py.typed"]
